#
# Continuous integration.
#
# Split into parallel jobs rather than one long pipeline, because feedback time is
# what decides whether people run CI before pushing. The fast checks finish in ~2
# minutes; the slow ones run alongside rather than behind them.
#
# The same stages exist in the Jenkinsfile. Both are deliberately thin: all the real
# logic lives in Maven, so neither CI system is load-bearing and the build behaves
# identically on a laptop.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Without this, a busy
# branch queues runs that are already obsolete and the queue becomes the bottleneck.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: compile, unit tests, formatting. No containers, no network
  # beyond the dependency cache.
  # ---------------------------------------------------------------------------
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on the POMs. Dependency resolution is the single
          # largest cost in a cold build here - roughly 4 minutes against 20
          # seconds warm.
          cache: maven

      # Guards against the executable bit being lost again.
      #
      # Windows cannot represent it, so git records mvnw as 100644 and every
      # Linux job fails with "Permission denied" - in three jobs at once, which
      # reads as a broken build rather than a file mode. `git update-index
      # --chmod=+x` fixes it; this check makes a regression say so plainly.
      - name: Check wrapper is executable
        run: |
          for f in mvnw scripts/fetch-model.sh deploy/docker/strip-native-libs.sh; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable in git. Run: git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "all scripts executable"

      - name: Compile and unit test
        run: ./mvnw ${{ env.MAVEN_ARGS }} verify -DskipITs

      # Uploaded even when tests fail - that is precisely when the report is
      # wanted, and a failed step skips subsequent ones without `if: always()`.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/target/site/jacoco-aggregate/**
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Testcontainers-backed integration tests. Separate job because they need
  # Docker and take minutes, and nothing in the fast job should wait for them.
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Docker is preinstalled on ubuntu-latest, so Testcontainers works with no
      # setup. Pulling the images up front keeps the pull time out of the test
      # timeouts, where a slow registry looks like a flaky test.
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine &
          docker pull pgvector/pgvector:0.8.7-pg17-trixie &
          wait

      - name: Run integration tests
        run: ./mvnw ${{ env.MAVEN_ARGS }} verify
        env:
          # Testcontainers' resource reaper. Disabled on ephemeral CI runners:
          # the whole VM is destroyed afterwards, so the reaper only adds a
          # container and a startup race.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Static analysis. Runs in parallel with the tests; its findings do not depend
  # on them.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Coverage thresholds are relaxed here so SpotBugs and PMD findings are
      # always reported. The coverage gate is enforced in its own job, where a
      # failure means "coverage" and not "something in the quality profile".
      - name: SpotBugs, PMD, CPD and format check
        run: >
          ./mvnw ${{ env.MAVEN_ARGS }} verify -Pquality -DskipITs
          -Dcoverage.line.minimum=0 -Dcoverage.branch.minimum=0

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/cpd.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Coverage gate. Its own job so a failure says exactly one thing.
  #
  # Expected to FAIL until coverage reaches the threshold. That is deliberate:
  # the gate reflects reality rather than being lowered to match it. See
  # PROGRESS.md for the current figure.
  # ---------------------------------------------------------------------------
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory until the gap is closed. Remove this line to make it blocking -
    # that is the one-line change that turns the gate on.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Enforce coverage thresholds
        run: ./mvnw ${{ env.MAVEN_ARGS }} verify -Pquality
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # ---------------------------------------------------------------------------
  # Mutation testing.
  #
  # The metric that actually matters for this codebase, and the reason it gets its
  # own job. Line coverage proves a line ran; a killed mutant proves an assertion
  # would have noticed it changing. For a cache whose dangerous failure mode is
  # "returns the wrong tenant's answer" rather than "throws", that distinction is
  # the whole point - a test that calls lookup() and asserts nothing about which
  # row came back scores 100% line coverage and catches none of it.
  #
  # Not on pull requests. PITest re-runs the test suite once per surviving mutant,
  # and with STRONGER mutators over reactive code that is tens of minutes - far too
  # slow to sit in front of a merge. On main and on demand is the right cadence for
  # a number that moves slowly.
  # ---------------------------------------------------------------------------
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    # Advisory on its first runs, exactly as coverage-gate is: the threshold is 70
    # and the score has never been measured, so making it blocking before the
    # number is known would either fail the build on an unknown or tempt someone to
    # lower the threshold to whatever came out - which is how a quality gate becomes
    # decoration. Remove this line once the measured score clears 70.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit tests only, and that exclusion lives in the POM rather than here:
      # PITest finds its own tests, so `-DskipITs` would not have reached it. See
      # `excludedTestClasses` in the root POM for why running the ITs under PITest
      # would not merely be slow but would inflate the score.
      #
      # SCOPED TO THE FOUR MODULES THAT HAVE UNIT TESTS. control-plane, metering,
      # indexer and audit have none - one Testcontainers IT each and nothing else.
      # Since PITest excludes the ITs, running it there would mutate code no test
      # can kill, and every mutant would be scored SURVIVED or NO_COVERAGE. The
      # overall number would collapse toward zero and would be measuring "these
      # four modules have no unit tests", which is already known and recorded in
      # PROGRESS.md, rather than the test quality of the code that is unit-tested.
      #
      # threads=4 rather than the POM's laptop-friendly 2: ubuntu-latest has 4 vCPU,
      # and this is a timeout risk, not a correctness one.
      - name: Run mutation analysis
        run: |
          ./mvnw ${{ env.MAVEN_ARGS }} verify -Pmutation -DskipITs \
            -pl common,embedding,kafka-support,gateway \
            -Dthreads=4

      - name: Summarise
        if: always()
        run: python scripts/pit-summary.py >> "$GITHUB_STEP_SUMMARY"

      # The HTML report is the only place a specific surviving mutant can be read
      # in context, line by line. The summary says which classes to look at; this
      # says what was changed.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: '**/target/pit-reports/**'
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Dependency and secret scanning.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history: a secret committed and later removed is
          # still in the history and still has to be rotated.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The NVD API throttles hard without a key, which makes this the slowest
      # step by far. The cache makes repeat runs tolerable; NVD_API_KEY (free
      # from nvd.nist.gov) makes the first one tolerable too.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP dependency check
        continue-on-error: true
        run: >
          ./mvnw ${{ env.MAVEN_ARGS }} verify -Psecurity -DskipTests
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SonarCloud.
  #
  # Cloud rather than self-hosted: SonarQube Community embeds Elasticsearch and
  # needs ~2.5 GB, which does not fit on the development machine alongside the
  # stack. A CI runner has the RAM and the token lives in GitHub secrets rather
  # than on a laptop.
  #
  # Skipped automatically when SONAR_TOKEN is absent, so forks and clones are not
  # broken by a secret they cannot have.
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues to authors and to
          # compute "new code" against the base branch. A shallow clone makes
          # every line look new.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Build, test and analyse
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: >
          ./mvnw ${{ env.MAVEN_ARGS }} verify sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dcoverage.line.minimum=0 -Dcoverage.branch.minimum=0

      - name: Report when Sonar is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SonarCloud skipped - SONAR_TOKEN is not set."
          echo "Set SONAR_TOKEN (secret) plus SONAR_ORGANIZATION and"
          echo "SONAR_PROJECT_KEY (variables) to enable it."

  # ---------------------------------------------------------------------------
  # Container images. Only on main, and only once everything else is green.
  # ---------------------------------------------------------------------------
  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [build, integration-test, static-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, control-plane, metering, indexer, audit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package
        run: ./mvnw ${{ env.MAVEN_ARGS }} package -DskipTests

      # Image repository names must be LOWERCASE. The OCI distribution spec
      # restricts them to [a-z0-9._-] and buildx rejects anything else with
      # "repository name must be lowercase" - a failure that surfaces only in
      # the check annotation, not in the step log. github.repository_owner
      # preserves the account's capitalisation, so it can never be pasted into
      # a tag, and GitHub expressions have no lowercase function.
      #
      # The full tag list is assembled here, once, so that the build, the scan
      # and the push cannot disagree about what they are operating on.
      - name: Resolve image tags
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          ghcr="ghcr.io/$(lower "$OWNER")/ai-gateway-$SERVICE"
          echo "SCAN_REF=$ghcr:$SHA" >> "$GITHUB_ENV"

          {
            echo "IMAGE_TAGS<<__TAGS__"
            echo "$ghcr:$SHA"
            echo "$ghcr:latest"
            # Docker Hub is tagged only when a namespace is configured, so a
            # fork without the variable builds and scans exactly the same way
            # and simply pushes one registry fewer.
            if [ -n "$DOCKERHUB_NS" ]; then
              dh="$(lower "$DOCKERHUB_NS")/ai-gateway-$SERVICE"
              echo "$dh:$SHA"
              echo "$dh:latest"
            fi
            echo "__TAGS__"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # GHCR rather than Docker Hub: free for public images, no pull-rate limit
      # on CI, and authenticated by the built-in GITHUB_TOKEN - so there is no
      # registry credential to manage at all.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Docker Hub, as a secondary target.
      #
      # GHCR stays primary: it authenticates with the built-in GITHUB_TOKEN, so
      # there is no credential to manage, and it has no pull-rate limit for CI.
      # Docker Hub is here because it is where this project's images are
      # published for people outside GitHub.
      #
      # Skipped silently when the variable is absent, so a fork or a clone is
      # never broken by a credential it cannot have.
      # ---------------------------------------------------------------------
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ONE build, loaded into the local daemon under every tag.
      #
      # This used to be three build-push-action calls - build-and-load, push to
      # GHCR, push to Docker Hub - each of which re-sent the ~600 MB context and
      # re-ran the build. Beyond being slow, it meant Trivy scanned one image
      # and a LATER build produced the bytes that were actually published. They
      # were near-certainly identical, but "near-certainly" is not a property a
      # vulnerability gate should rest on. Building once and pushing that exact
      # image makes the scanned digest and the published digest the same object.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          # Loaded locally so Trivy can scan BEFORE anything is pushed.
          # Scanning after a push means a vulnerable image is already pullable.
          load: true
          push: false
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        # Pinned to a tag that exists. An action version that does not resolve
        # fails the job at "Set up job" - before any step runs - so the log
        # shows no step name and the cause is visible only in the annotation.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        # always(), but ONLY when the scan actually wrote a file. A bare
        # always() turns one failure into two red steps: the build fails, Trivy
        # never runs, and the upload then fails with "Path does not exist" -
        # which is the error you see first and the one that explains nothing.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Push images
        # Plain `docker push` of the already-built, already-scanned image.
        #
        # Redirected from a file rather than piped into the loop. A pipe runs
        # the `while` in a SUBSHELL, and a plain `run:` block is `bash -e`
        # WITHOUT pipefail - so a push that fails on any tag but the last one
        # would leave the step green and the registry half-updated.
        run: |
          set -euo pipefail
          # echo, not printf '%s': the value from GITHUB_ENV has no trailing
          # newline, and `read` returns false on an unterminated final line -
          # which would silently skip the LAST tag. The empty-line guard below
          # covers the opposite case.
          echo "$IMAGE_TAGS" > /tmp/tags.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "::group::push $tag"
            docker push "$tag"
            echo "::endgroup::"
          done < /tmp/tags.txt

  # ---------------------------------------------------------------------------
  # The tenant dashboard. Independent of the Java build, so it runs in parallel
  # rather than behind a 90-second Maven reactor it has nothing to do with.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `npm ci`, not `npm install`. ci installs exactly the lock file and fails
      # if package.json and the lock disagree - which is the whole point of
      # committing a lock file. `install` would quietly resolve a newer version
      # and the build would differ from the one tested locally.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The initial chunk is 314 kB because the charts are code-split out of it.
      # Asserted rather than trusted: an accidental static import of a chart
      # component pulls the whole Recharts/d3 runtime back into the entry
      # bundle, doubling it, and nothing else would report that.
      - name: Check the entry bundle stayed split
        run: |
          set -euo pipefail
          entry=$(ls -1 dist/assets/index-*.js | head -1)
          bytes=$(wc -c < "$entry")
          echo "entry bundle: $entry ($bytes bytes)"
          if [ "$bytes" -gt 450000 ]; then
            echo "::error::Entry bundle is ${bytes} bytes, over the 450000 budget."
            echo "A chart component is probably imported statically instead of via lazy()."
            ls -la dist/assets/
            exit 1
          fi

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Infrastructure code. Fast, and catches the mistakes that are expensive to
  # find at apply time.
  # ---------------------------------------------------------------------------
  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render the chart
        run: |
          set -euo pipefail
          CHART=deploy/helm/ai-gateway

          # EVERY profile, not just the defaults. A values file that only one
          # person ever renders is a values file that breaks silently - and the
          # profiles are where the per-environment mistakes live.
          for values in "$CHART/values.yaml" "$CHART"/values-*.yaml; do
            name=$(basename "$values")

            # values-obs.yaml is an OVERLAY with no service definitions; it is
            # rendered on top of dev rather than alone.
            if [ "$name" = "values-obs.yaml" ]; then
              extra="-f $CHART/values-dev.yaml"
            else
              extra=""
            fi

            echo "--- $name"
            helm lint "$CHART" $extra -f "$values"

            # `template` catches what `lint` does not: a value referenced but
            # never defined renders as empty rather than failing, and the
            # resulting manifest is invalid in a way only rendering reveals.
            helm template aigw "$CHART" $extra -f "$values" > /dev/null

            # Again with the Prometheus Operator CRD present, so the
            # ServiceMonitor template is actually exercised. Without
            # --api-versions it is skipped by its capability guard and a syntax
            # error in it would never be caught here.
            helm template aigw "$CHART" $extra -f "$values"               --api-versions monitoring.coreos.com/v1 > /dev/null
          done

      - name: Validate the k3d cluster config and scripts
        run: |
          set -euo pipefail
          python -c "import yaml,io; yaml.safe_load(io.open('deploy/k3d/cluster.yaml'))"
          echo "  ok  deploy/k3d/cluster.yaml parses"
          for s in scripts/*.sh; do
            bash -n "$s"
            # Executable bit, because Windows does not record one and a 100644
            # script fails on a Linux runner with "Permission denied" - see the
            # mvnw incident in PROGRESS.md.
            [ -x "$s" ] || { echo "::error::$s is not executable (git update-index --chmod=+x $s)"; exit 1; }
            echo "  ok  $s"
          done

      - name: Validate the OpenAPI spec against the code
        run: |
          python -m pip install --quiet pyyaml openapi-spec-validator
          python scripts/check-openapi.py

      - name: Validate the Grafana dashboards against the code
        run: |
          # A panel querying a metric that does not exist renders EMPTY with no
          # error, which is indistinguishable from "no traffic yet" - so a broken
          # dashboard can sit broken indefinitely. This asserts every metric a
          # panel queries is a meter the Java actually registers.
          python scripts/check-dashboards.py

      - name: Dashboards match their generator
        run: |
          # The JSON is generated. Hand-editing it would be silently reverted the
          # next time anyone runs the generator, so the committed files must be
          # exactly what the generator produces.
          python scripts/build-dashboards.py
          if ! git diff --quiet -- deploy/grafana/dashboards; then
            echo "::error::deploy/grafana/dashboards is out of sync with scripts/build-dashboards.py"
            git diff --stat -- deploy/grafana/dashboards
            exit 1
          fi
          echo "dashboards are in sync with the generator"

      - name: Validate the observability values
        run: |
          set -euo pipefail
          for f in deploy/k8s/observability/*.yaml deploy/k8s/prometheus-adapter/values.yaml; do
            python -c "import yaml,io,sys; yaml.safe_load(io.open(sys.argv[1],encoding='utf-8'))" "$f"
            echo "  ok  $f"
          done

      - name: Verify the USL fitter
        run: |
          # The load campaign cannot run here - it needs a cluster - but the
          # thing that turns measurements into a conclusion can be verified, and
          # it is the part where a silent error would be worst: a fitting routine
          # that returns plausible wrong coefficients produces a confident wrong
          # answer that no amount of real data would reveal.
          #
          # The central test generates throughput from known coefficients and
          # asserts the fitter recovers them.
          python -m pip install --quiet numpy
          python loadtest/analysis/test_usl.py

      - name: Check the k6 scripts parse
        run: |
          set -euo pipefail
          for f in loadtest/k6/*.js loadtest/k6/lib/*.js; do
            node --check "$f"
            echo "  ok  $f"
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          set -euo pipefail
          for dir in terraform/local terraform/aws; do
            echo "::group::$dir"
            # -backend=false: there is no remote backend and no credentials.
            # `validate` never contacts a provider's API, so this works without
            # either - which is the whole reason terraform/aws can be checked in
            # a pipeline that has no AWS account.
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          # tflint downloads the aws ruleset from GitHub Releases. Without a
          # token that is an anonymous request against a shared runner IP, and
          # it fails intermittently with a 403 rate limit - which looks like a
          # network problem rather than a missing credential.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --config is REQUIRED, not a convenience. .tflint.hcl lives at the
          # repository root, and --chdir makes tflint look for it in the TARGET
          # directory instead - so without an explicit path it runs with no
          # ruleset at all: the aws plugin is never loaded, nothing is checked,
          # and the step passes. A gate that always passes is worse than no gate.
          CONFIG="$GITHUB_WORKSPACE/.tflint.hcl"

          for dir in terraform/local terraform/aws; do
            echo "::group::tflint $dir"
            # --init downloads the provider ruleset declared in .tflint.hcl,
            # which is what catches a wrong instance type or a deprecated
            # argument - things `validate` cannot see because it only checks
            # schema.
            tflint --chdir="$dir" --config="$CONFIG" --init
            tflint --chdir="$dir" --config="$CONFIG"
            echo "::endgroup::"
          done

          # Prove the ruleset actually loaded, rather than trusting that it did.
          tflint --config="$CONFIG" --version

      - name: Set up Python for checkov
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: checkov
        run: |
          set -euo pipefail
          python -m pip install --quiet checkov
          # Soft-fail OFF: a security finding should fail the build. The
          # suppressions live in .checkov.yaml with a written reason each, so a
          # finding here is either real or needs a justification someone reads.
          checkov --directory terraform             --framework terraform             --config-file .checkov.yaml             --compact

      - name: Infracost
        # Skipped silently without a key, so a fork is never broken by a
        # credential it cannot have. The free tier is enough for this.
        if: ${{ secrets.INFRACOST_API_KEY != '' }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          # terraform/aws only. terraform/local deploys Helm releases to a k3d
          # cluster, which has no cloud cost to estimate.
          infracost breakdown --path terraform/aws --format table

      - name: Infracost skipped
        if: ${{ secrets.INFRACOST_API_KEY == '' }}
        run: |
          echo "::notice::Infracost skipped - INFRACOST_API_KEY is not set."
          echo "The hand-computed estimate in terraform/aws/README.md is therefore"
          echo "unverified: roughly \$3,500/month idle, \$25-30k at the modelled peak."
