spring:
  application:
    name: ai-gateway-indexer

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:55432/aigw}
    username: ${DB_USERNAME:aigw}
    password: ${DB_PASSWORD:aigw}
    pool:
      initial-size: 2
      max-size: 8

  flyway:
    # Deliberately off. This service WRITES prompt_cache but does not own its schema:
    # the gateway cannot start without that table, so the migration lives in the
    # gateway module and runs there. Two services migrating one table would race on
    # deploy and leave the schema history inconsistent.
    #
    # In a deployment where the two are released independently, ownership should move
    # here and the gateway should become a pure reader.
    # See docs/adr/0010-schema-ownership.md
    enabled: false

server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

gateway:
  indexer:
    # TTL sweep. Disable in environments where another process owns retention.
    eviction-enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer-group: indexer-v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    io.vasanth.gateway: INFO
    # Kafka's own logging is extremely verbose at INFO and drowns everything else.
    org.apache.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
