{{/*
Prometheus Operator ServiceMonitor.

Guarded on the CRD actually being installed. Without the check, `helm install`
fails on a cluster that has no Prometheus Operator with an error naming a
resource kind the user has never heard of.
*/}}
{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-gateway.fullname" $ }}-{{ $name }}
  labels:
    {{- include "ai-gateway.componentLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ai-gateway.componentSelectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  endpoints:
    - port: http
      path: {{ $.Values.monitoring.serviceMonitor.path }}
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
