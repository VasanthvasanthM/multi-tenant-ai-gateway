{{/*
Pod Disruption Budgets.

These constrain VOLUNTARY disruption only - node drains, cluster upgrades.
They do nothing for a node that simply dies. Their job is to stop an
administrator draining three nodes in sequence and taking every replica with
them.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $replicas := ternary $svc.autoscaling.minReplicas $svc.replicaCount $svc.autoscaling.enabled }}
{{- if gt (int $replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-gateway.fullname" $ }}-{{ $name }}
  labels:
    {{- include "ai-gateway.componentLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ai-gateway.componentSelectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
