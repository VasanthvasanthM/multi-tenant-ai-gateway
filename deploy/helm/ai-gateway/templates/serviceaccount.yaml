{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-gateway.serviceAccountName" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of these services call the Kubernetes API. Mounting the token would
# hand an attacker who compromises a pod a credential for the API server, for
# no functional benefit.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
